# Best-effort pings to reduce free HF Space cold starts (48 h idle sleep).
# Scheduled Actions can be delayed or disabled; this is not an uptime guarantee.
# Note: GitHub pauses scheduled workflows after 60 days with no repo activity;
# re-enable from the Actions tab if that happens.
name: keep-warm

# No checkout, repository access, or credentials are needed.
permissions: {}

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12 h, off the top of the hour
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /health (waits through a cold start)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS --connect-timeout 10 -o /dev/null -w "%{http_code}" --max-time 60 \
                   https://shyamravidath-carnatify.hf.space/health || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Space did not answer /health with 200"
          exit 1
